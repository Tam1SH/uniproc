cargo-features = ["codegen-backend"]
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
default-members = ["crates/desktop2"]
members = [
    "crates/app-contracts2",
    "crates/desktop2",
    "crates/domain2",
    "crates/ui2",
]

# The crates below (context, domain, domain-test-kit, domain/src/features/*,
# app-contracts, slint-adapter, widgets, macros, desktop) are the old
# Slint + forsl stack. They're deliberately NOT workspace members right now:
# their path deps pointed at a `../forsl` checkout that no longer exists
# (forsl was renamed/moved to the `guinea` repo, with a materially different
# API - Reducer/Scope/Router redesign), so fixing their manifests just to
# keep them compiling isn't worth it. New features are being rebuilt fresh
# against `guinea` in crates/*2 alongside them; the old crates stay on disk,
# inert, until each feature's new version is done, then get deleted outright.

[workspace.dependencies]
# --- guinea (split into its own repo, path dep to a sibling checkout) ---
guinea-core = { path = "../guinea/crates/guinea-core" }
guinea-macros = { path = "../guinea/crates/guinea-macros" }
guinea-codegen = { path = "../guinea/crates/guinea-codegen" }
guinea-trace = { path = "../guinea/crates/guinea-trace" }
guinea = { path = "../guinea/crates/guinea" }
inventory = "0.3"

# --- guinea-meta (split into its own repo, path dep to a sibling checkout) ---
guinea-meta = { path = "../guinea-meta/crates/guinea-meta" }
guinea-meta-build = { path = "../guinea-meta/crates/guinea-meta-build" }

# --- guicons (path dep to a sibling checkout: the windows-reactor backend
# isn't published to crates.io yet - see ../guicons's own uncommitted work) ---
guicons = { path = "../guicons/crates/guicons" }
guicons-build = { path = "../guicons/crates/guicons-build" }

# --- Internal ---
app-contracts2 = { path = "crates/app-contracts2" }
domain2 = { path = "crates/domain2" }
ui2 = { path = "crates/ui2" }

# Pinned to the exact rev guinea's own workspace pins, for the same reason
# guinea pins it: two separate lockfiles resolving an unpinned `git = "..."`
# dep independently can silently drift onto different commits.
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "44ea4a7858e7ddc08a090aad1df72b54c79ff8b1" }
windows-reactor-setup = { git = "https://github.com/Tam1SH/windows-rs", rev = "44ea4a7858e7ddc08a090aad1df72b54c79ff8b1" }
windows-canvas = { git = "https://github.com/Tam1SH/windows-rs", rev = "44ea4a7858e7ddc08a090aad1df72b54c79ff8b1" }

# --- Custom & Git Dependencies ---
ogurpchik = { git = "https://github.com/Tam1SH/oguRPChik", branch = "master", features = ["rkyv-codec", "vsock", "uds"] }
uniproc-protocol = { git = "https://github.com/Tam1SH/uniproc-protocol", branch = "master" }


# --- UI Stack (Slint & Windowing) ---
slint = { version = "=1.17.1", features = ["renderer-skia"] }
slint-build = "=1.17.1"
i-slint-backend-winit = "=1.17.1"
i-slint-compiler = "=1.17.1"
i-slint-core = "=1.17.1"
i-slint-backend-testing = "=1.17.1"
winit = "0.30.12"
window-vibrancy = "0.7.1"
raw-window-handle = "0.6.2"

# --- Async & Networking ---
tokio = { version = "1.49.0", features = ["full"] }
compio = { version = "0.18.0", features = ["net", "io-compat", "process", "macros", "time"] }
futures = "0.3.31"
async-trait = "0.1.89"
flume = { version = "0.12.0", features = ["async"] }
bytes = "1.11.1"
socket2 = "0.6.2"

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
rkyv = { version = "0.8.14", features = ["bytecheck", "std"] }
uuid = { version = "1.23.0", features = ["v4"] }
amethystate = "0.9.2"

# --- Logging & Diagnostics ---
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2.3"
dhat = "0.3"

# --- System & Platform ---
windows = { version = "0.61.3", features = [
    "Win32_UI_Controls", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging", "Win32_System_Com",
    "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Performance",
    "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_System_Threading", "UI",
    "UI_ViewManagement", "Win32_System_Hypervisor", "Management", "Management_Deployment",
    "ApplicationModel", "ApplicationModel_Core", "Win32_Storage_Packaging", "Win32_Storage_Packaging_Appx", "Win32_System_Services",
] }
libc = "1.0.0-alpha.2"
sysinfo = "0.38.0"

# --- Proc-Macro & Code Generation ---
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

# --- Utilities ---
anyhow = "1.0.100"
arc-swap = "1.7.1"
bon = "3.9.1"
cfg-if = "1"
dashmap = { version = "6.1.0", features = ["serde"] }
fxhash = "0.2.1"
fluent-templates = "0.14.0"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
lazy_static = "1.5.0"
smallvec = "1.15.1"
static_assertions = "1.1.0"
ttl_cache = "0.5"
walkdir = "2.5.0"
derive_more = "2.1.1"
smol_str = "0.3.6"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# --- Profiles ---
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
