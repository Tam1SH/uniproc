cargo-features = ["codegen-backend"]
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
default-members = ["crates/desktop"]
members = [
    "crates/app-contracts",
    "crates/context",
    "crates/desktop",
    "crates/domain",
    "crates/ui",
    "crates/xtask",
]

[workspace.dependencies]
# --- guinea ---
guinea-core = { git = "https://github.com/uniproc-dev/guinea", rev = "0f53049" }
guinea-macros = { git = "https://github.com/uniproc-dev/guinea", rev = "0f53049" }
guinea-codegen = { git = "https://github.com/uniproc-dev/guinea", rev = "0f53049" }
guinea-trace = { git = "https://github.com/uniproc-dev/guinea", rev = "0f53049" }
guinea = { git = "https://github.com/uniproc-dev/guinea", rev = "0f53049" }

guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", rev = "e34d575" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", rev = "e34d575" }
inventory = "0.3"

# --- guinea-meta ---
guinea-meta = { git = "https://github.com/uniproc-dev/guinea-meta", tag = "v0.1.0" }
guinea-meta-build = { git = "https://github.com/uniproc-dev/guinea-meta", tag = "v0.1.0" }

guicons = "0.3.2"
guicons-build = "0.3.2"

# --- Internal ---
app-contracts = { path = "crates/app-contracts" }
context = { path = "crates/context" }
domain = { path = "crates/domain" }
ui = { path = "crates/ui" }

# Pinned to the exact rev guinea's own workspace pins, for the same reason
# guinea pins it: two separate lockfiles resolving an unpinned `git = "..."`
# dep independently can silently drift onto different commits.
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }
windows-reactor-setup = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }
windows-canvas = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }
windows-collections = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }
windows-core = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }
windows-reference = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }

# --- Custom & Git Dependencies ---
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.4.0" }
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", tag = "v0.7.0" }
capnp = "0.27"
capnp-rpc = "0.27"

raw-window-handle = "0.6.2"

# --- Async & Networking ---
tokio = { version = "1.49.0", features = ["full"] }
compio = { version = "0.18.0", features = ["net", "io-compat", "process", "macros", "time"] }
futures = "0.3.31"
flume = { version = "0.12.0", features = ["async"] }

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
uuid = { version = "1.23.0", features = ["v4"] }
amethystate = "0.11.0"
amethystate-core = "0.11.0"

# --- Logging & Diagnostics ---
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# --- System & Platform ---
windows = { version = "0.61.3", features = [
    "Win32_UI_Controls", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging", "Win32_System_Com",
    "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Performance",
    "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_System_Threading", "UI",
    "UI_ViewManagement", "Win32_System_Hypervisor", "Management", "Management_Deployment",
    "ApplicationModel", "ApplicationModel_Core", "Win32_Storage_Packaging", "Win32_Storage_Packaging_Appx", "Win32_System_Services",
] }

# --- Utilities ---
anyhow = "1.0.100"
cfg-if = "1"
fluent-templates = "0.14.0"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
ttl_cache = "0.5"
derive_more = { version = "2.1.1", features = ["debug"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# guicons (pulled from crates.io) declares its own optional
# `windows-reactor` dependency as a plain crates.io version (crates.io
# strips the git/rev spec on publish, requiring *some* version) - since
# windows-reactor was never actually published there, that edge needs
# its own patch redirecting it to the same git rev pinned above (Cargo
# doesn't chain one [patch] block's target through another, so this has
# to name the same rev by hand, not just point at the git source).
[patch.crates-io]
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }


# --- Profiles ---
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
